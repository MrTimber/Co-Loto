<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Co-Loto · Grille co-créée</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Co-Loto">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <script src="/js/splash.js"></script>
  <header class="site-header">
    <a class="logo" href="/"><img src="/img/logo.png" alt="Co-Loto" width="80" height="48"></a>
    <span class="game-badge" id="header-badge" hidden></span>
  </header>
  <main class="container">
    <section class="card narrow" id="grid-card">
      <p class="muted">Chargement de la grille…</p>
    </section>
    <section class="card narrow account-offer" id="account-offer" hidden></section>
    <p class="center"><a href="/" class="button">Créer une nouvelle grille</a></p>
  </main>
  <footer class="site-footer">
    co-loto.com est un site gratuit, sans aucune affiliation avec la Française des Jeux (<a href="https://www.fdj.fr/" rel="noopener">fdj.fr</a>).
  </footer>
  <script type="module" src="/js/grille.js"></script>
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
