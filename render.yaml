# Déploiement gratuit sur Render (https://render.com), offre « Free ».
services:
  - type: web
    name: co-loto
    runtime: node
    plan: free
    # Francfort : au plus près des joueurs (la région d'un service ne peut plus changer ensuite).
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base Turso (voir le README) : valeurs à saisir dans Render, jamais dans le dépôt.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Adresse email du superadmin de l'espace d'administration (voir le README).
      - key: SUPERADMIN_EMAIL
        sync: false
      # Serveur SMTP pour les codes de connexion et la vérification des adresses (voir le README).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
